<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>С юбилеем! 🎂</title>
    <style>
        /* ВСЕ ВАШИ СТИЛИ (как в исходном коде) — они полностью сохранены */
        :root {
            --sky: #CCFFFF;
            --sea1: #3399FF;
            --sea2: #33CCCC;
            --sea3: #33CCFF;
            --deep-blue: #336699;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        /* ==================== СТРАНИЦА 1 ==================== */
        #page1 {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--sky);
            overflow: hidden;
        }

        /* НЕБО */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(180deg, #CCFFFF 0%, #b3ecff 60%, #99ddff 100%);
            z-index: 0;
        }

        /* СОЛНЦЕ */
        .sun {
            position: absolute;
            top: 8%;
            right: 12%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #FFF9C4 0%, #FFE082 25%, #FFD54F 50%, #FFB300 75%, transparent 80%);
            border-radius: 50%;
            z-index: 2;
            box-shadow:
                0 0 40px 20px rgba(255, 235, 150, 0.8),
                0 0 100px 50px rgba(255, 220, 100, 0.5),
                0 0 180px 80px rgba(255, 200, 60, 0.35),
                0 0 250px 120px rgba(255, 180, 40, 0.2);
            animation: sunGlow 3s ease-in-out infinite;
            pointer-events: none;
        }
        .sun-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #FFFFFF 0%, #FFFDE7 40%, #FFE57F 100%);
            border-radius: 50%;
        }
        @keyframes sunGlow {
            0%, 100% {
                box-shadow: 0 0 40px 20px rgba(255, 235, 150, 0.8), 0 0 100px 50px rgba(255, 220, 100, 0.5), 0 0 180px 80px rgba(255, 200, 60, 0.35), 0 0 250px 120px rgba(255, 180, 40, 0.2);
            }
            50% {
                box-shadow: 0 0 55px 25px rgba(255, 240, 160, 0.95), 0 0 120px 60px rgba(255, 225, 110, 0.6), 0 0 200px 90px rgba(255, 205, 65, 0.45), 0 0 280px 135px rgba(255, 185, 45, 0.25);
            }
        }

        /* ОБЛАКА */
        .clouds-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 3;
            pointer-events: none;
        }
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.7);
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud-1 {
            width: 140px;
            height: 55px;
            top: 18%;
            left: -160px;
            border-radius: 55px;
            animation: cloudFloat1 28s linear infinite;
        }
        .cloud-1::before { width: 65px; height: 65px; top: -38px; left: 25px; }
        .cloud-1::after { width: 80px; height: 80px; top: -45px; left: 60px; }
        .cloud-2 {
            width: 170px;
            height: 60px;
            top: 28%;
            left: -200px;
            border-radius: 60px;
            animation: cloudFloat2 34s linear infinite;
            animation-delay: 8s;
        }
        .cloud-2::before { width: 70px; height: 70px; top: -40px; left: 30px; }
        .cloud-2::after { width: 90px; height: 85px; top: -48px; left: 75px; }
        .cloud-3 {
            width: 120px;
            height: 45px;
            top: 8%;
            left: -140px;
            border-radius: 45px;
            animation: cloudFloat3 24s linear infinite;
            animation-delay: 15s;
        }
        .cloud-3::before { width: 55px; height: 55px; top: -32px; left: 20px; }
        .cloud-3::after { width: 70px; height: 65px; top: -38px; left: 50px; }
        .cloud-4 {
            width: 100px;
            height: 38px;
            top: 14%;
            left: -120px;
            border-radius: 38px;
            animation: cloudFloat1 30s linear infinite;
            animation-delay: 20s;
            opacity: 0.85;
        }
        .cloud-4::before { width: 48px; height: 48px; top: -28px; left: 18px; }
        .cloud-4::after { width: 58px; height: 55px; top: -34px; left: 42px; }
        @keyframes cloudFloat1 { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 300px)); } }
        @keyframes cloudFloat2 { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 350px)); } }
        @keyframes cloudFloat3 { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 280px)); } }

        /* МОРЕ */
        .sea-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48%;
            z-index: 5;
            pointer-events: none;
        }
        .sea-layer {
            position: absolute;
            bottom: 0;
            left: -5%;
            width: 120%;
            height: 100%;
            border-radius: 50% 50% 0 0 / 30% 30% 0 0;
        }
        .sea-bg {
            background: linear-gradient(180deg, #33CCFF 0%, #33CCCC 35%, #3399FF 100%);
            z-index: 1;
            animation: waveSlow 6s ease-in-out infinite;
        }
        .sea-mid {
            background: linear-gradient(180deg, rgba(51, 204, 255, 0.7) 0%, rgba(51, 204, 204, 0.6) 40%, rgba(51, 153, 255, 0.7) 100%);
            z-index: 2;
            animation: waveMid 5s ease-in-out infinite;
            bottom: -8px;
            border-radius: 55% 50% 0 0 / 35% 30% 0 0;
        }
        .sea-front {
            background: linear-gradient(180deg, rgba(80, 210, 255, 0.85) 0%, rgba(60, 200, 210, 0.8) 30%, rgba(40, 160, 255, 0.85) 100%);
            z-index: 3;
            animation: waveFast 4s ease-in-out infinite;
            bottom: -15px;
            border-radius: 60% 55% 0 0 / 40% 35% 0 0;
        }
        @keyframes waveSlow { 0%,100% { transform: translateX(0) translateY(0); } 25% { transform: translateX(2%) translateY(-6px); } 50% { transform: translateX(0) translateY(0); } 75% { transform: translateX(-2%) translateY(-5px); } }
        @keyframes waveMid { 0%,100% { transform: translateX(0) translateY(0); } 33% { transform: translateX(-3%) translateY(-8px); } 66% { transform: translateX(2%) translateY(-4px); } }
        @keyframes waveFast { 0%,100% { transform: translateX(0) translateY(0); } 30% { transform: translateX(3%) translateY(-7px); } 60% { transform: translateX(-2%) translateY(-6px); } 85% { transform: translateX(1%) translateY(-3px); } }

        /* ПЕНА */
        .foam-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48%;
            z-index: 6;
            pointer-events: none;
        }
        .foam {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.75;
            animation: foamFloat 3.5s ease-in-out infinite;
            box-shadow: 0 0 8px 3px rgba(255, 255, 255, 0.6);
        }
        .foam-1 { width: 28px; height: 18px; bottom: 28%; left: 10%; animation-delay: 0s; }
        .foam-2 { width: 22px; height: 14px; bottom: 32%; left: 25%; animation-delay: 0.7s; }
        .foam-3 { width: 32px; height: 20px; bottom: 26%; left: 42%; animation-delay: 1.4s; }
        .foam-4 { width: 24px; height: 15px; bottom: 30%; left: 58%; animation-delay: 2.1s; }
        .foam-5 { width: 30px; height: 19px; bottom: 24%; left: 72%; animation-delay: 0.3s; }
        .foam-6 { width: 20px; height: 13px; bottom: 34%; left: 85%; animation-delay: 1.8s; }
        .foam-7 { width: 26px; height: 16px; bottom: 22%; left: 92%; animation-delay: 2.5s; }
        .foam-8 { width: 18px; height: 12px; bottom: 36%; left: 16%; animation-delay: 1.1s; }
        .foam-9 { width: 34px; height: 22px; bottom: 20%; left: 50%; animation-delay: 3s; }
        .foam-10 { width: 21px; height: 14px; bottom: 38%; left: 66%; animation-delay: 0.9s; }
        @keyframes foamFloat {
            0%,100% { transform: translateY(0) scale(1); opacity: 0.75; }
            30% { transform: translateY(-12px) scale(1.15); opacity: 0.95; }
            60% { transform: translateY(-4px) scale(0.95); opacity: 0.6; }
            80% { transform: translateY(-8px) scale(1.05); opacity: 0.8; }
        }

        /* КРЕЙСЕР */
        .cruiser-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            cursor: pointer;
            animation: cruiserRock 4s ease-in-out infinite;
            transition: filter 0.2s;
        }
        .cruiser-wrapper:hover { filter: brightness(1.15) drop-shadow(0 0 20px rgba(255, 255, 200, 0.7)); }
        .cruiser-wrapper:active { filter: brightness(1.3) scale(0.96); transition: transform 0.1s; }
        @keyframes cruiserRock {
            0%,100% { transform: translate(-50%, -50%) rotate(-2deg) translateY(0); }
            25% { transform: translate(-50%, -50%) rotate(1.5deg) translateY(-10px); }
            50% { transform: translate(-50%, -50%) rotate(-1deg) translateY(-3px); }
            75% { transform: translate(-50%, -50%) rotate(2deg) translateY(-12px); }
        }
        .cruiser-svg { width: 220px; height: auto; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3)); }
        .cruiser-hint {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            opacity: 0;
            animation: hintPulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes hintPulse { 0%,100% { opacity: 0; transform: translateX(-50%) translateY(0); } 30% { opacity: 1; transform: translateX(-50%) translateY(-6px); } 70% { opacity: 1; transform: translateX(-50%) translateY(-6px); } }

        /* ДЕЛЬФИНЫ */
        .dolphin {
            position: absolute;
            z-index: 8;
            pointer-events: none;
            width: 70px;
            height: auto;
            animation: dolphinJump 3s ease-in-out infinite;
        }
        @keyframes dolphinJump {
            0% { transform: translateY(80px) rotate(-15deg); opacity: 0; }
            10% { opacity: 1; }
            40% { transform: translateY(-50px) rotate(5deg); opacity: 1; }
            60% { transform: translateY(-60px) rotate(15deg); opacity: 1; }
            80% { transform: translateY(20px) rotate(30deg); opacity: 0.7; }
            100% { transform: translateY(80px) rotate(40deg); opacity: 0; }
        }

        /* ТЕРМИНАЛ */
        #terminal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #terminal-overlay.active { display: flex; }
        .terminal-window {
            background: #0a0a0f;
            border: 2px solid #1a3a3a;
            border-radius: 12px;
            padding: 28px 32px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 0 60px rgba(0, 180, 200, 0.3), 0 0 120px rgba(0, 0, 0, 0.8);
            font-family: 'Consolas', 'Courier New', monospace;
            color: #ffffff;
        }
        .terminal-title { font-size: 1.1rem; color: #66ddcc; margin-bottom: 20px; border-bottom: 1px solid #1a4a4a; padding-bottom: 10px; letter-spacing: 1px; }
        .terminal-line { font-size: 1.25rem; margin: 8px 0; opacity: 0; transform: translateY(8px); transition: all 0.4s ease; }
        .terminal-line.show { opacity: 1; transform: translateY(0); }
        .terminal-line .ok { color: #00ff66; font-weight: bold; margin-left: 6px; }
        .terminal-btn-wrap { text-align: center; margin-top: 22px; opacity: 0; transform: translateY(10px); transition: all 0.5s ease; }
        .terminal-btn-wrap.show { opacity: 1; transform: translateY(0); }
        .terminal-btn {
            background: linear-gradient(135deg, #00cc88, #009966);
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 0.5px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 200, 130, 0.4);
        }
        .terminal-btn:hover { background: linear-gradient(135deg, #00ee99, #00bb77); box-shadow: 0 6px 28px rgba(0, 220, 150, 0.6); transform: translateY(-2px); }
        .terminal-close { position: absolute; top: 20px; right: 28px; color: #888; font-size: 1.5rem; cursor: pointer; z-index: 101; transition: color 0.3s; }
        .terminal-close:hover { color: #fff; }

        /* ==================== СТРАНИЦА 2 ==================== */
        #page2 {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #2c5282, #1a3a5f);
            overflow-y: auto;
            overflow-x: hidden;
            display: none;
            z-index: 10;
        }
        #page2.active { display: block; }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
        }

        /* Ссылка возврата - теперь не перекрывает заголовок */
        .back-link {
            position: absolute;
            top: 18px;
            left: 24px;
            color: #cce6ff;
            font-size: 0.95rem;
            text-decoration: underline;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }
        .back-link:hover { color: #ffffff; background: rgba(0, 0, 0, 0.65); }

        /* Основной контент страницы 2 — теперь с отступом сверху, чтобы ссылка не перекрывала h1 */
        .page2-content {
            position: relative;
            z-index: 5;
            max-width: 700px;
            margin: 0 auto;
            padding: 80px 24px 40px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .page2-content h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 22px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
        }
        .typewriter {
            color: #ffffff;
            font-size: 1.15rem;
            line-height: 1.8;
            text-align: left;
            white-space: pre-wrap;
            min-height: 200px;
        }
        .typewriter .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #fff;
            margin-left: 2px;
            animation: blink 0.7s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Финальный заголовок С 35-летием */
        .birthday-title {
            text-align: center;
            font-size: 2.2rem;
            margin: 30px 0 20px;
            color: #FFD966;
            text-shadow: 0 3px 12px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }
        @media (max-width: 600px) {
            .birthday-title { font-size: 1.7rem; }
        }

        /* Штурвал – закреплён внизу страницы */
        .helm-wrapper {
            margin-top: auto;
            text-align: center;
            padding: 20px 0 30px;
        }
        .helm-container {
            display: inline-block;
            cursor: pointer;
            transition: transform 0.3s;
            z-index: 10;
        }
        .helm-container:hover { transform: rotate(20deg) scale(1.08); }
        .helm-container:active { transform: rotate(-15deg) scale(0.95); }
        .helm-svg {
            width: 100px;
            height: 100px;
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.5));
            transition: filter 0.3s;
        }
        .helm-container:hover .helm-svg { filter: drop-shadow(0 6px 22px rgba(255, 215, 100, 0.7)); }

        /* Плавающие фото (плавающие объекты) */
        .floating-photo {
            position: fixed;
            z-index: 150;
            pointer-events: none;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
            width: 160px;
            height: auto;
            max-width: 30vw;
            transition: opacity 0.4s;
            opacity: 0;
        }
        .floating-photo.show { opacity: 1; }

        @media (max-width: 600px) {
            .cruiser-svg { width: 140px; }
            .sun { width: 80px; height: 80px; top: 6%; right: 8%; }
            .sun-core { width: 44px; height: 44px; }
            .terminal-window { padding: 18px 16px; width: 95%; }
            .terminal-line { font-size: 1rem; }
            .page2-content h1 { font-size: 1.4rem; }
            .typewriter { font-size: 0.95rem; }
            .helm-svg { width: 80px; height: 80px; }
            .floating-photo { width: 120px; max-width: 35vw; }
            .page2-content { padding-top: 75px; }
        }
    </style>
</head>
<body>

    <!-- ==================== СТРАНИЦА 1 ==================== -->
    <div id="page1">
        <div class="sky"></div>
        <div class="sun"><div class="sun-core"></div></div>
        <div class="clouds-container">
            <div class="cloud cloud-1"></div><div class="cloud cloud-2"></div>
            <div class="cloud cloud-3"></div><div class="cloud cloud-4"></div>
        </div>
        <div class="sea-container">
            <div class="sea-layer sea-bg"></div>
            <div class="sea-layer sea-mid"></div>
            <div class="sea-layer sea-front"></div>
        </div>
        <div class="foam-container">
            <div class="foam foam-1"></div><div class="foam foam-2"></div><div class="foam foam-3"></div>
            <div class="foam foam-4"></div><div class="foam foam-5"></div><div class="foam foam-6"></div>
            <div class="foam foam-7"></div><div class="foam foam-8"></div><div class="foam foam-9"></div>
            <div class="foam foam-10"></div>
        </div>
        <div class="cruiser-wrapper" id="cruiserBtn" title="Запустить терминал">
            <div class="cruiser-hint">🚢 Нажми на крейсер!</div>
            <svg class="cruiser-svg" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
                <polygon points="20,50 280,50 300,75 260,90 40,90 0,75" fill="#4a5568" stroke="#2d3748" stroke-width="2"/>
                <polygon points="30,52 270,52 285,72 250,85 50,85 15,72" fill="#718096"/>
                <rect x="55" y="20" width="120" height="32" rx="4" fill="#a0aec0" stroke="#718096" stroke-width="1.5"/>
                <rect x="70" y="5" width="40" height="18" rx="3" fill="#cbd5e0" stroke="#718096" stroke-width="1"/>
                <rect x="80" y="0" width="20" height="8" rx="2" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1"/>
                <rect x="120" y="8" width="14" height="30" rx="3" fill="#e53e3e" stroke="#c53030" stroke-width="1.5"/>
                <rect x="145" y="12" width="12" height="26" rx="3" fill="#e53e3e" stroke="#c53030" stroke-width="1.5"/>
                <circle cx="127" cy="0" r="6" fill="#e2e8f0" opacity="0.7"/>
                <circle cx="135" cy="-8" r="8" fill="#edf2f7" opacity="0.5"/>
                <circle cx="150" cy="-4" r="7" fill="#e2e8f0" opacity="0.55"/>
                <circle cx="38" cy="58" r="3" fill="#63b3ed" stroke="#2b6cb0" stroke-width="1"/>
                <circle cx="52" cy="58" r="3" fill="#63b3ed" stroke="#2b6cb0" stroke-width="1"/>
                <circle cx="66" cy="58" r="3" fill="#63b3ed" stroke="#2b6cb0" stroke-width="1"/>
                <circle cx="255" cy="58" r="3" fill="#63b3ed" stroke="#2b6cb0" stroke-width="1"/>
                <circle cx="269" cy="58" r="3" fill="#63b3ed" stroke="#2b6cb0" stroke-width="1"/>
                <line x1="175" y1="22" x2="175" y2="-10" stroke="#4a5568" stroke-width="2"/>
                <polygon points="175,-10 205,-4 175,2" fill="#f6e05e" stroke="#d69e2e" stroke-width="0.8"/>
                <text x="90" y="72" font-family="Arial" font-size="7" fill="#2d3748" font-weight="bold">DIN.NIK</text>
            </svg>
        </div>
        <div id="dolphins-container" style="position:absolute;bottom:0;left:0;width:100%;height:48%;z-index:8;pointer-events:none;"></div>
    </div>

    <!-- ==================== ТЕРМИНАЛ ==================== -->
    <div id="terminal-overlay">
        <span class="terminal-close" id="terminalClose">✕</span>
        <div class="terminal-window" id="terminalWindow">
            <div class="terminal-title">OS Din.Nik ver.3.5 — Обновление системы</div>
            <div id="terminalLines"></div>
            <div class="terminal-btn-wrap" id="terminalBtnWrap">
                <button class="terminal-btn" id="openPage2Btn">🚀 Open Din.Nik ver.3.5</button>
            </div>
        </div>
    </div>

    <!-- ==================== СТРАНИЦА 2 ==================== -->
    <div id="page2">
        <canvas id="confetti-canvas"></canvas>
        <span class="back-link" id="backLink">← Вернуться на главную страницу</span>
        <div class="page2-content">
            <h1>Ди, с юбилеем тебя! 🎉</h1>
            <div class="typewriter" id="typewriterText"></div>
            <h2 class="birthday-title" id="birthdayTitle" style="display: none;">С 35-летием! 🎂💫</h2>
            <div class="helm-wrapper">
                <div class="helm-container" id="helmBtn" title="Покрути штурвал — откроются фото!">
                    <svg class="helm-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="42" fill="none" stroke="#c89b3c" stroke-width="7"/>
                        <circle cx="50" cy="50" r="30" fill="none" stroke="#d4af37" stroke-width="4"/>
                        <circle cx="50" cy="50" r="10" fill="#8b6914" stroke="#c89b3c" stroke-width="3"/>
                        <circle cx="50" cy="50" r="4" fill="#3e2c0a"/>
                        <line x1="50" y1="8" x2="50" y2="40" stroke="#b8942e" stroke-width="5" stroke-linecap="round"/>
                        <line x1="50" y1="60" x2="50" y2="92" stroke="#b8942e" stroke-width="5" stroke-linecap="round"/>
                        <line x1="8" y1="50" x2="40" y2="50" stroke="#b8942e" stroke-width="5" stroke-linecap="round"/>
                        <line x1="60" y1="50" x2="92" y2="50" stroke="#b8942e" stroke-width="5" stroke-linecap="round"/>
                        <line x1="20" y1="20" x2="38" y2="38" stroke="#b8942e" stroke-width="5" stroke-linecap="round"/>
                        <line x1="62" y1="62" x2="80" y2="80" stroke="#b8942e" stroke-width="5" stroke-linecap="round"/>
                        <line x1="20" y1="80" x2="38" y2="62" stroke="#b8942e" stroke-width="5" stroke-linecap="round"/>
                        <line x1="62" y1="38" x2="80" y2="20" stroke="#b8942e" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="50" cy="5" r="4" fill="#6b4c0a" stroke="#c89b3c" stroke-width="2"/>
                        <circle cx="50" cy="95" r="4" fill="#6b4c0a" stroke="#c89b3c" stroke-width="2"/>
                        <circle cx="5" cy="50" r="4" fill="#6b4c0a" stroke="#c89b3c" stroke-width="2"/>
                        <circle cx="95" cy="50" r="4" fill="#6b4c0a" stroke="#c89b3c" stroke-width="2"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== АУДИО (только один трек) ==================== -->
    <audio id="audio1" src="images/jig.mp3" loop preload="auto"></audio>

    <script>
        (function() {
            // ============ DOM-элементы ============
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const cruiserBtn = document.getElementById('cruiserBtn');
            const terminalOverlay = document.getElementById('terminal-overlay');
            const terminalClose = document.getElementById('terminalClose');
            const terminalLines = document.getElementById('terminalLines');
            const terminalBtnWrap = document.getElementById('terminalBtnWrap');
            const openPage2Btn = document.getElementById('openPage2Btn');
            const backLink = document.getElementById('backLink');
            const typewriterEl = document.getElementById('typewriterText');
            const helmBtn = document.getElementById('helmBtn');
            const confettiCanvas = document.getElementById('confetti-canvas');
            const dolphinsContainer = document.getElementById('dolphins-container');
            const birthdayTitle = document.getElementById('birthdayTitle');

            // Аудио (один трек для всей открытки)
            const audio1 = document.getElementById('audio1');

            // ============ ПЛАВАЮЩИЕ ФОТО (4 шт) ============
            const photoUrls = [
                "images/i1.jpg",
                "images/i2.jpg",
                "images/i3.jpg",
                "images/i4.jpg"
            ];
            let activeFloatingPhotos = [];

            function clearAllFloatingPhotos() {
                activeFloatingPhotos.forEach(photo => {
                    if (photo.img && photo.img.remove) photo.img.remove();
                    if (photo.moveInterval) clearInterval(photo.moveInterval);
                    if (photo.fadeTimer) clearTimeout(photo.fadeTimer);
                });
                activeFloatingPhotos = [];
            }

            function createFloatingPhoto(src, delayMs = 0) {
                setTimeout(() => {
                    if (!src || src === "") {
                        console.warn("Фото не добавлено: пустой путь");
                        return;
                    }
                    const img = document.createElement('img');
                    img.src = src;
                    img.className = 'floating-photo';
                    img.alt = 'Памятное фото';
                    img.style.position = 'fixed';
                    img.style.zIndex = '150';
                    
                    const vw = window.innerWidth;
                    const vh = window.innerHeight;
                    const maxW = Math.min(200, vw * 0.35);
                    const maxH = maxW * 0.8;
                    let x = Math.random() * (vw - maxW - 40) + 20;
                    let y = Math.random() * (vh - maxH - 100) + 60;
                    let dx = (Math.random() - 0.5) * 2.2;
                    let dy = (Math.random() - 0.5) * 2.2;
                    if (Math.abs(dx) < 0.5) dx = dx < 0 ? -0.8 : 0.8;
                    if (Math.abs(dy) < 0.5) dy = dy < 0 ? -0.8 : 0.8;
                    
                    img.style.left = x + 'px';
                    img.style.top = y + 'px';
                    document.body.appendChild(img);
                    requestAnimationFrame(() => img.classList.add('show'));
                    
                    const moveInterval = setInterval(() => {
                        x += dx;
                        y += dy;
                        const w = img.offsetWidth;
                        const h = img.offsetHeight;
                        if (x <= 5) { x = 5; dx = -dx; }
                        if (x + w >= vw - 5) { x = vw - w - 5; dx = -dx; }
                        if (y <= 5) { y = 5; dy = -dy; }
                        if (y + h >= vh - 40) { y = vh - h - 40; dy = -dy; }
                        img.style.left = x + 'px';
                        img.style.top = y + 'px';
                    }, 35);
                    
                    const fadeTimer = setTimeout(() => {
                        img.classList.remove('show');
                        setTimeout(() => {
                            img.remove();
                            clearInterval(moveInterval);
                            const idx = activeFloatingPhotos.findIndex(p => p.img === img);
                            if (idx !== -1) activeFloatingPhotos.splice(idx, 1);
                        }, 500);
                    }, 9000);
                    
                    activeFloatingPhotos.push({ img, moveInterval, fadeTimer });
                }, delayMs);
            }
            
            let photoSequenceActive = false;
            function showFourPhotosSequentially() {
                if (photoSequenceActive) clearAllFloatingPhotos();
                photoSequenceActive = true;
                for (let i = 0; i < photoUrls.length; i++) {
                    createFloatingPhoto(photoUrls[i], i * 400);
                }
                setTimeout(() => { photoSequenceActive = false; }, 10000);
            }

            // ============ ДЕЛЬФИНЫ ============
            let dolphinTimers = [];
            function spawnDolphin() {
                const dolphin = document.createElement('img');
                // ⚠️ ПОДСТАВИТЬ ПУТЬ К ИЗОБРАЖЕНИЮ ДЕЛЬФИНА (например, "images/dolphin.png")
                dolphin.src = "";   // если пусто — будет эмодзи
                dolphin.alt = '🐬';
                dolphin.className = 'dolphin';
                dolphin.onerror = function() {
                    dolphin.style.display = 'none';
                    const fallback = document.createElement('span');
                    fallback.textContent = '🐬';
                    fallback.style.cssText = `position:absolute; font-size:50px; z-index:8; pointer-events:none; animation: dolphinJump 3s ease-in-out infinite;`;
                    fallback.style.left = dolphin.style.left;
                    fallback.style.bottom = dolphin.style.bottom;
                    fallback.style.animationDelay = dolphin.style.animationDelay;
                    dolphinsContainer.appendChild(fallback);
                    setTimeout(() => fallback.remove(), 3200);
                };
                dolphin.style.position = 'absolute';
                dolphin.style.left = (Math.random() * 85) + '%';
                dolphin.style.bottom = '5%';
                dolphin.style.animationDelay = '0s';
                dolphin.style.animationDuration = (2.5 + Math.random() * 2) + 's';
                dolphinsContainer.appendChild(dolphin);
                setTimeout(() => dolphin.remove(), 3500);
            }
            function startDolphins() {
                function scheduleDolphin() {
                    const delay = 2000 + Math.random() * 3000;
                    const timer = setTimeout(() => { spawnDolphin(); scheduleDolphin(); }, delay);
                    dolphinTimers.push(timer);
                }
                scheduleDolphin();
                setTimeout(() => spawnDolphin(), 800);
            }
            function stopDolphins() {
                dolphinTimers.forEach(t => clearTimeout(t));
                dolphinTimers = [];
                dolphinsContainer.innerHTML = '';
            }

            // ============ ТЕРМИНАЛ ============
            let terminalActive = false;
            const terminalItems = [
                '🎂 Проверка нервной системы',
                '🎂 Загрузка обновлённых модулей тела',
                '🎂 Калибровка компаса для новых путешествий',
                '🎂 Установка соединений с близкими объектами',
                '🎂 Проверка совместимости с OS «Идеальный мужчина»',
                '🎂 Запуск дочерней ветки OS «Lev.son»',
            ];
            function openTerminal() {
                if (terminalActive) return;
                terminalActive = true;
                terminalOverlay.classList.add('active');
                terminalLines.innerHTML = '';
                terminalBtnWrap.classList.remove('show');
                terminalItems.forEach((item, index) => {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'terminal-line';
                    lineDiv.innerHTML = item + ' <span class="ok" style="visibility:hidden;">Ок</span>';
                    terminalLines.appendChild(lineDiv);
                    setTimeout(() => {
                        lineDiv.classList.add('show');
                        setTimeout(() => {
                            const okSpan = lineDiv.querySelector('.ok');
                            if (okSpan) okSpan.style.visibility = 'visible';
                        }, 600);
                    }, index * 900);
                });
                setTimeout(() => terminalBtnWrap.classList.add('show'), terminalItems.length * 900 + 800);
            }
            function closeTerminal() {
                terminalActive = false;
                terminalOverlay.classList.remove('active');
                terminalLines.innerHTML = '';
                terminalBtnWrap.classList.remove('show');
            }
            cruiserBtn.addEventListener('click', openTerminal);
            terminalClose.addEventListener('click', closeTerminal);
            terminalOverlay.addEventListener('click', (e) => { if (e.target === terminalOverlay) closeTerminal(); });

            // ============ КОНФЕТТИ ============
            let confettiActive = false;
            let confettiRAF = null;
            let confettiParticles = [];
            const ctx = confettiCanvas.getContext('2d');
            function resizeConfettiCanvas() {
                confettiCanvas.width = window.innerWidth;
                confettiCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeConfettiCanvas);
            resizeConfettiCanvas();
            function createConfettiParticle() {
                return {
                    x: Math.random() * confettiCanvas.width,
                    y: -20 - Math.random() * 100,
                    w: 8 + Math.random() * 10,
                    h: 5 + Math.random() * 8,
                    color: `hsl(${Math.random()*360}, 80%, 60%)`,
                    speedY: 2 + Math.random() * 4,
                    speedX: -1.5 + Math.random() * 3,
                    rotation: Math.random() * 360,
                    rotSpeed: -3 + Math.random() * 6,
                    opacity: 0.8 + Math.random() * 0.2,
                };
            }
            function startConfetti() {
                if (confettiActive) return;
                confettiActive = true;
                confettiParticles = [];
                for (let i = 0; i < 100; i++) {
                    const p = createConfettiParticle();
                    p.y = Math.random() * confettiCanvas.height;
                    confettiParticles.push(p);
                }
                function animateConfetti() {
                    if (!confettiActive) return;
                    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                    for (let p of confettiParticles) {
                        p.y += p.speedY;
                        p.x += p.speedX;
                        p.rotation += p.rotSpeed;
                        if (p.y > confettiCanvas.height + 40) {
                            p.y = -30;
                            p.x = Math.random() * confettiCanvas.width;
                        }
                        if (p.x < -40) p.x = confettiCanvas.width + 30;
                        if (p.x > confettiCanvas.width + 40) p.x = -30;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.globalAlpha = p.opacity;
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                        ctx.restore();
                    }
                    confettiRAF = requestAnimationFrame(animateConfetti);
                }
                animateConfetti();
            }
            function stopConfetti() {
                confettiActive = false;
                if (confettiRAF) cancelAnimationFrame(confettiRAF);
                confettiParticles = [];
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }

            // ============ ПЕЧАТНАЯ МАШИНКА ============
            let typewriterTimer = null;
            const typewriterFullText = `Этот возраст — удивительное время, когда женская красота расцветает в полную силу, соединяясь с мудростью, уверенностью и внутренней гармонией. Ты невероятно красивая, яркая и обаятельная девушка, которая своим появлением способна украсить любой день.

        В этот особенный день хочется сказать тебе огромное спасибо за то, какая ты есть.

        · Ты — прекрасный, верный и надежный друг, на которого всегда можно положиться в любую минуту.
        · Ты — невероятно ответственная, любящая и заботливая мать, отдающая всю душу своему ребенку.
        · Ты — чуткая, внимательная дочь и замечательная, поддерживающая сестра, которая является настоящей гордостью и опорой для всей семьи.

        Желаем тебе, чтобы твоя внутренняя батарейка никогда не разряжалась, а любви и тепла, которые ты так щедро даришь окружающим, возвращалось тебе в стократном размере. Пусть каждый день приносит поводы для улыбок, здоровье будет крепким, а в доме царят уют и гармония. Будь счастлива, любима и оставайся всегда такой же вдохновляющей!`;
            
            function startTypewriter() {
                typewriterEl.innerHTML = '';
                birthdayTitle.style.display = 'none';
                let charIndex = 0;
                function typeNext() {
                    if (charIndex < typewriterFullText.length) {
                        const char = typewriterFullText.charAt(charIndex);
                        const existingCursor = typewriterEl.querySelector('.cursor');
                        if (existingCursor) existingCursor.remove();
                        if (char === '\n') typewriterEl.innerHTML += '<br>';
                        else typewriterEl.innerHTML += char;
                        const cursor = document.createElement('span');
                        cursor.className = 'cursor';
                        typewriterEl.appendChild(cursor);
                        charIndex++;
                        typewriterTimer = setTimeout(typeNext, 35);
                    } else {
                        const existingCursor = typewriterEl.querySelector('.cursor');
                        if (existingCursor) existingCursor.remove();
                        birthdayTitle.style.display = 'block';
                    }
                }
                typeNext();
            }

            // ============ АУДИО (один трек) ============
            function playAudio1() { 
                if (audio1.src && audio1.src !== window.location.href) {
                    audio1.play().catch(e => console.log("Автовоспроизведение заблокировано, нужно взаимодействие"));
                } 
            }
            // Никаких stopAudio1 — пусть музыка играет непрерывно

            let audio1Started = false;
            function tryStartAudio1() { 
                if (!audio1Started && audio1.src && audio1.src !== window.location.href) { 
                    audio1.play().then(() => audio1Started = true).catch(() => {}); 
                } 
            }
            document.addEventListener('click', function initAudio() { 
                tryStartAudio1(); 
                if (audio1Started) document.removeEventListener('click', initAudio); 
            }, false);
            
            // ============ ПЕРЕХОД НА СТРАНИЦУ 2 ============
            openPage2Btn.addEventListener('click', function() {
                closeTerminal();
                // Музыку НЕ останавливаем
                stopDolphins();
                page1.style.display = 'none';
                page2.classList.add('active');
                startTypewriter();
                startConfetti();
                clearAllFloatingPhotos();
            });
            
            // ============ ВОЗВРАТ НА ГЛАВНУЮ ============
            backLink.addEventListener('click', function() {
                stopConfetti();
                clearAllFloatingPhotos();
                if (typewriterTimer) clearTimeout(typewriterTimer);
                typewriterEl.innerHTML = '';
                birthdayTitle.style.display = 'none';
                page2.classList.remove('active');
                page1.style.display = '';
                // Музыка продолжает играть, ничего не перезапускаем
                stopDolphins();
                startDolphins();
            });
            
            // ============ ШТУРВАЛ ============
            helmBtn.addEventListener('click', showFourPhotosSequentially);
            
            // ============ ИНИЦИАЛИЗАЦИЯ ============
            function init() {
                startDolphins();
                tryStartAudio1();
                page2.classList.remove('active');
                page1.style.display = '';
                console.log("✅ Открытка готова, музыка играет на обеих страницах.");
            }
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && terminalActive) closeTerminal(); });
            init();
        })();
    </script>
