<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ди, с днём рождения!</title>
    <style>
        :root {
            --deep-blue: #060d1a;
            --ocean-blue: #0a1a33;
            --foam-white: #e8f0f8;
            --text-white: #ffffff;
            --glow-blue: #4da8da;
            --terminal-bg: #050a14;
            --sky-top: #5ba3e6;
            --sky-bottom: #c9e2ff;
            --horizon: 45%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--deep-blue);
            color: var(--text-white);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        /* ========== PAGE CONTAINERS ========== */
        .page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .page-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* ========== PAGE 1 - OCEAN SCENE ========== */
        #page1 {
            z-index: 10;
        }
        #page1.page-visible {
            z-index: 10;
        }
        #page1.page-hidden {
            z-index: 0;
        }

        #waveCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Ship button */
        .ship-container {
            position: relative;
            z-index: 20;
            cursor: pointer;
            animation: shipBob 3.2s ease-in-out infinite;
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 0 18px rgba(140, 200, 240, 0.5));
        }
        .ship-container:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 35px rgba(160, 220, 255, 0.85));
        }
        .ship-container:active {
            transform: scale(0.94);
            filter: drop-shadow(0 0 50px rgba(180, 230, 255, 1));
            transition: transform 0.1s ease, filter 0.1s ease;
        }
        .ship-container.loading-active {
            pointer-events: none;
            animation: shipBobFast 0.6s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(100, 200, 255, 0.9));
        }

        @keyframes shipBob {
            0%,
            100% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-14px);
            }
            50% {
                transform: translateY(-6px);
            }
            75% {
                transform: translateY(-18px);
            }
        }
        @keyframes shipBobFast {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* Ship SVG styles */
        .ship-svg {
            width: 260px;
            height: auto;
            display: block;
        }
        @media (max-width: 600px) {
            .ship-svg {
                width: 180px;
            }
        }
        .ship-hull {
            fill: #3a4a5a;
            stroke: #b0c8dc;
            stroke-width: 2.2;
            stroke-linejoin: round;
}
        .ship-superstructure {
            fill: #4a5a6a;
            stroke: #c0d0e0;
            stroke-width: 1.5;
        }
        .ship-turret {
            fill: #5a6a7a;
            stroke: #a0b8cc;
            stroke-width: 1.2;
        }
        .ship-antenna {
            stroke: #c0d0e0;
            stroke-width: 1.8;
            stroke-linecap: round;
        }
        .ship-window {
            fill: #aad4f0;
        }
        .ship-flag {
            fill: #e8745c;
        }

        /* ========== LOADING OVERLAY ========== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 8, 20, 0.82);
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .terminal-window {
            background: var(--terminal-bg);
            border: 1.5px solid rgba(120, 180, 220, 0.5);
            border-radius: 14px;
            padding: 28px 32px;
            min-width: 380px;
            max-width: 580px;
            width: 85%;
            box-shadow: 0 0 60px rgba(30, 100, 180, 0.45),
                inset 0 0 40px rgba(10, 40, 80, 0.3);
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #e8f4ff;
            font-weight: 700;
            font-size: 1.8rem;
            line-height: 1.8;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(100, 180, 240, 0.6);
        }
        @media (max-width: 500px) {
            .terminal-window {
                padding: 18px 16px;
                min-width: auto;
                font-size: 1.2rem;
                border-radius: 10px;
            }
        }
        .terminal-line {
            opacity: 0;
            transition: opacity 0.2s ease;
            margin: 6px 0;
        }
        .terminal-line.visible {
            opacity: 1;
        }
        .terminal-progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(30, 60, 100, 0.5);
            border-radius: 4px;
            margin: 12px 0;
            overflow: hidden;
        }
        .terminal-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4da8da, #8cd0f0, #4da8da);
            border-radius: 4px;
            transition: width 0.3s linear;
            box-shadow: 0 0 14px rgba(80, 170, 220, 0.8);
        }
        .open-btn-container {
            text-align: center;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
        }
        .open-btn-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .open-btn {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(135deg, #1a4a7a, #0d2d50);
            border: 2px solid #6ab8e0;
            border-radius: 30px;
            color: #e8f4ff;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(70, 150, 210, 0.5);
            white-space: nowrap;
        }
        .open-btn:hover {
            background: linear-gradient(135deg, #1e5a90, #123860);
            border-color: #90d4f8;
            box-shadow: 0 0 45px rgba(90, 180, 240, 0.8);
transform: scale(1.04);
            color: #ffffff;
        }
        .open-btn:active {
            transform: scale(0.96);
            box-shadow: 0 0 60px rgba(100, 200, 255, 1);
            transition: transform 0.1s ease;
        }

        /* ========== PAGE 2 - FIREWORKS & MESSAGE ========== */
        #page2 {
            z-index: 0;
            background: #1abc9c; /* цвет морской волны */
        }
        #page2.page-visible {
            z-index: 20;
        }
        #page2.page-hidden {
            z-index: 0;
        }
        #fireworkCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #confettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .birthday-message {
            position: relative;
            z-index: 25;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.5s ease 1.8s, transform 1.5s ease 1.8s;
        }
        .birthday-message.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .birthday-message h1 {
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            font-weight: 300;
            letter-spacing: 3px;
            line-height: 1.5;
            text-shadow: 0 0 40px rgba(180, 210, 240, 0.7),
                0 0 80px rgba(140, 180, 220, 0.4),
                0 0 120px rgba(100, 150, 200, 0.3);
            color: #ffffff;
        }
        .birthday-message .name {
            font-weight: 700;
            letter-spacing: 5px;
            font-size: clamp(2.2rem, 6vw, 4rem);
            display: block;
            margin-bottom: 8px;
            text-shadow: 0 0 50px rgba(220, 200, 160, 0.8),
                0 0 100px rgba(200, 170, 130, 0.5),
                0 0 160px rgba(180, 150, 110, 0.3);
            color: #fff8ed;
        }
        .birthday-message .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.9;
            margin-top: 6px;
            color: #f0f8ff;
            text-shadow: 0 0 20px rgba(160, 200, 230, 0.5);
        }

        /* Back button */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 30;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            backdrop-filter: blur(5px);
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        .back-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- ==================== AUDIO ELEMENTS ==================== -->
    <!-- ЗАМЕНИТЕ ИМЕНА ФАЙЛОВ НА СВОИ -->
    <audio id="audio1" src="od.mp3" loop preload="auto"></audio>
    <audio id="audio2" src="jig.mp3" preload="auto"></audio>

    <!-- ==================== PAGE 1 - OCEAN SCENE ==================== -->
    <div id="page1" class="page page-visible">
        <canvas id="waveCanvas"></canvas>
        <div class="ship-container" id="shipBtn" title="Запустить Di.Nic v. 3.5">
            <!-- Большой крейсер -->
            <svg class="ship-svg" viewBox="0 0 260 160" xmlns="http://www.w3.org/2000/svg">
                <!-- Корпус -->
                <path d="M20,105 L240,105 L225,140 L35,140 Z" class="ship-hull"/>
                <!-- Носовое украшение -->
<path d="M20,105 L8,98 L14,112 Z" fill="#b0c8dc" stroke="#a0b8cc" stroke-width="1.5"/>
                <!-- Палуба -->
                <rect x="45" y="95" width="170" height="10" fill="#4a5a6a" stroke="#c0d0e0" stroke-width="1"/>
                <!-- Надстройка -->
                <rect x="90" y="60" width="80" height="35" class="ship-superstructure"/>
                <rect x="100" y="40" width="60" height="20" class="ship-superstructure"/>
                <!-- Окна надстройки -->
                <circle cx="110" cy="70" r="3" class="ship-window"/>
                <circle cx="130" cy="70" r="3" class="ship-window"/>
                <circle cx="150" cy="70" r="3" class="ship-window"/>
                <circle cx="115" cy="50" r="2.5" class="ship-window"/>
                <circle cx="135" cy="50" r="2.5" class="ship-window"/>
                <!-- Башни с орудиями -->
                <rect x="50" y="88" width="22" height="12" rx="2" class="ship-turret"/>
                <line x1="61" y1="88" x2="61" y2="78" stroke="#a0b8cc" stroke-width="3"/>
                <rect x="190" y="88" width="22" height="12" rx="2" class="ship-turret"/>
                <line x1="201" y1="88" x2="201" y2="78" stroke="#a0b8cc" stroke-width="3"/>
                <!-- Антенны и радар -->
                <line x1="130" y1="40" x2="130" y2="20" class="ship-antenna"/>
                <circle cx="130" cy="18" r="5" fill="none" stroke="#c0d0e0" stroke-width="2"/>
                <line x1="100" y1="40" x2="85" y2="25" class="ship-antenna"/>
                <circle cx="83" cy="23" r="3" fill="#e8745c"/>
                <!-- Флаг -->
                <path d="M230,70 L250,70 L240,78 L248,85 L230,78 Z" class="ship-flag"/>
                <!-- Волны от корабля (декоративные) -->
                <path d="M20,140 Q30,135 40,140" stroke="#f0f8ff" stroke-width="2" fill="none" opacity="0.6"/>
                <path d="M220,140 Q230,135 240,140" stroke="#f0f8ff" stroke-width="2" fill="none" opacity="0.6"/>
            </svg>
        </div>
    </div>

    <!-- ==================== LOADING OVERLAY ==================== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="terminal-window" id="terminalWindow">
            <div class="terminal-line" data-delay="0">Di.Nic v. 3.5 — Обновление 3.5</div>
            <div class="terminal-line" data-delay="500">🎂 Проверка нервной системы — ОК</div>
            <div class="terminal-line" data-delay="1000">🎂 Загрузка обновлённых модулей тела — ОК</div>
            <div class="terminal-line" data-delay="1500">🎂 Калибровка компаса для новых путешествий — ОК</div>
            <div class="terminal-line" data-delay="2000">🎂 Установка соединений с семьёй и близким окружением — ОК</div>
            <div class="terminal-progress-bar" style="margin-top:15px;">
                <div class="terminal-progress-fill" id="progressFill"></div>
            </div>
            <div class="open-btn-container" id="openBtnContainer">
                <button class="open-btn" id="openBtn">Open Di.Nic v. 3.5</button>
            </div>
        </div>
    </div>

    <!-- ==================== PAGE 2 - CELEBRATION ==================== -->
    <div id="page2" class="page page-hidden">
        <canvas id="fireworkCanvas"></canvas>
        <canvas id="confettiCanvas"></canvas>
        <button class="back-button" id="backButton">← Вернуться назад</button>
        <div class="birthday-message" id="birthdayMsg">
            <h1>
                <span class="name">С днем рождения, Диана!</span>
                <span class="subtitle">Пусть в жизни будут только<br>приятные путешествия!</span>
            </h1>
        </div>
    </div>

    <script>
        (function() {
            // ==================== DOM REFERENCES ====================
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const shipBtn = document.getElementById('shipBtn');
const loadingOverlay = document.getElementById('loadingOverlay');
            const progressFill = document.getElementById('progressFill');
            const openBtnContainer = document.getElementById('openBtnContainer');
            const openBtn = document.getElementById('openBtn');
            const birthdayMsg = document.getElementById('birthdayMsg');
            const backButton = document.getElementById('backButton');
            const waveCanvas = document.getElementById('waveCanvas');
            const waveCtx = waveCanvas.getContext('2d');
            const fireworkCanvas = document.getElementById('fireworkCanvas');
            const fireworkCtx = fireworkCanvas.getContext('2d');
            const confettiCanvas = document.getElementById('confettiCanvas');
            const confettiCtx = confettiCanvas.getContext('2d');

            // Аудио элементы
            const audio1 = document.getElementById('audio1');
            const audio2 = document.getElementById('audio2');

            // ==================== AUDIO MANAGEMENT ====================
            function playAudio1() {
                if (audio1.paused) {
                    audio1.currentTime = 0;
                    audio1.play().catch(e => console.log('Audio1 play prevented:', e));
                }
            }

            function stopAudio1() {
                audio1.pause();
                audio1.currentTime = 0;
            }

            function playAudio2() {
                audio2.currentTime = 0;
                audio2.play().catch(e => console.log('Audio2 play prevented:', e));
            }

            function stopAudio2() {
                audio2.pause();
                audio2.currentTime = 0;
            }

            // ==================== WAVE CANVAS WITH SKY, SUN, CLOUDS, DOLPHINS ====================
            let waveAnimationId;
            let waveTime = 0;
            const foamParticles = [];
            const dolphins = [];
            let dolphinsTimer = 0;

            function resizeWaveCanvas() {
                waveCanvas.width = window.innerWidth;
                waveCanvas.height = window.innerHeight;
                seedFoamParticles();
            }
            resizeWaveCanvas();
            window.addEventListener('resize', resizeWaveCanvas);

            function seedFoamParticles() {
                foamParticles.length = 0;
                const count = Math.floor(waveCanvas.width / 8); // больше пены
                for (let i = 0; i < count; i++) {
                    foamParticles.push({
                        x: Math.random() * waveCanvas.width,
                        baseY: Math.random() * waveCanvas.height * 0.55 + waveCanvas.height * 0.4,
                        radius: Math.random() * 4 + 1.5,
                        speed: Math.random() * 0.5 + 0.2,
                        offset: Math.random() * Math.PI * 2,
                        amplitude: Math.random() * 20 + 5,
                        opacity: Math.random() * 0.7 + 0.3,
                    });
                }
            }

            // Добавление дельфина
            function spawnDolphin() {
                const horizonY = waveCanvas.height * 0.45;
                dolphins.push({
                    x: -30,
                    y: horizonY + Math.random() * 80 + 20,
                    speed: Math.random() * 2 + 2.5,
                    phase: Math.random() * Math.PI * 2,
                    amplitude: Math.random() * 25 + 10,
                    scale: Math.random() * 0.8 + 0.7,
                    alpha: 1,
                });
            }

            function drawSkyAndSun(ctx, w, h) {
                // Голубое небо градиент
                const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.45);
                skyGrad.addColorStop(0, '#5ba3e6');
                skyGrad.addColorStop(0.7, '#c9e2ff');
                skyGrad.addColorStop(1, '#e0f0ff');
                ctx.fillStyle = skyGrad;
ctx.fillRect(0, 0, w, h * 0.45);

                // Солнце
                const sunX = w * 0.8;
                const sunY = h * 0.15;
                const sunRadius = Math.min(w, h) * 0.08;
                ctx.save();
                ctx.shadowColor = '#fff9c4';
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#fffde7';
                ctx.fill();
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#fff9c4';
                ctx.arc(sunX, sunY, sunRadius * 0.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Облака (медленно двигаются)
                const clouds = [
                    { x: w * 0.2, y: h * 0.12, scale: 1.2, speed: 0.3 },
                    { x: w * 0.5, y: h * 0.2, scale: 0.9, speed: 0.2 },
                    { x: w * 0.7, y: h * 0.08, scale: 1.4, speed: 0.4 },
                    { x: w * 0.1, y: h * 0.25, scale: 1.0, speed: 0.25 },
                ];
                const now = waveTime * 0.1;
                clouds.forEach(c => {
                    const cloudX = (c.x + now * c.speed) % (w + 200) - 100;
                    drawCloud(ctx, cloudX, c.y, c.scale);
                });
            }

            function drawCloud(ctx, x, y, scale) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.arc(0, 0, 25, 0, Math.PI * 2);
                ctx.arc(30, -10, 30, 0, Math.PI * 2);
                ctx.arc(60, 0, 25, 0, Math.PI * 2);
                ctx.arc(20, 10, 20, 0, Math.PI * 2);
                ctx.arc(45, 5, 28, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.arc(15, -15, 18, 0, Math.PI * 2);
                ctx.arc(50, -5, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawWaves(timestamp) {
                waveTime = timestamp * 0.001;
                const w = waveCanvas.width;
                const h = waveCanvas.height;
                const horizonY = h * 0.45;
                waveCtx.clearRect(0, 0, w, h);

                // 1. Небо, солнце, облака
                drawSkyAndSun(waveCtx, w, h);

                // 2. Море (заливка от горизонта)
                const seaGrad = waveCtx.createLinearGradient(0, horizonY, 0, h);
                seaGrad.addColorStop(0, '#1e5d7a');
                seaGrad.addColorStop(0.3, '#0e3d54');
                seaGrad.addColorStop(1, '#061f2c');
                waveCtx.fillStyle = seaGrad;
                waveCtx.fillRect(0, horizonY, w, h - horizonY);

                // Область отсечения для волн, чтобы не лезли на небо
                waveCtx.save();
                waveCtx.beginPath();
                waveCtx.rect(0, horizonY, w, h - horizonY);
                waveCtx.clip();

                // Волны
                const waveLayers = [
                    { baseY: horizonY + 10, amplitude: 32, frequency: 0.015, speed: 0.6, color: '#1a4860',
                        foamOpacity: 0.5 },
                    { baseY: horizonY + 30, amplitude: 40, frequency: 0.018, speed: 0.8, color: '#143f54',
                        foamOpacity: 0.6 },
                    { baseY: horizonY + 55, amplitude: 45, frequency: 0.022, speed: 0.95, color: '#0f3548',
                        foamOpacity: 0.7 },
                    { baseY: horizonY + 85, amplitude: 50, frequency: 0.026, speed: 1.1, color: '#0b2d3d',
                        foamOpacity: 0.8 },
                    { baseY: horizonY + 120, amplitude: 42, frequency: 0.03, speed: 1.2, color: '#082433',
                        foamOpacity: 0.85 },
                ];

                waveLayers.forEach((layer) => {
waveCtx.beginPath();
                    waveCtx.moveTo(0, h);
                    const points = [];
                    const step = 4;
                    for (let x = 0; x <= w + step; x += step) {
                        const nx = x * layer.frequency;
                        const y = layer.baseY +
                            Math.sin(nx + waveTime * layer.speed) * layer.amplitude +
                            Math.sin(nx * 2.3 + waveTime * layer.speed * 1.4) * (layer.amplitude * 0.35) +
                            Math.sin(nx * 0.5 + waveTime * layer.speed * 0.6) * (layer.amplitude * 0.25);
                        points.push({ x, y });
                        waveCtx.lineTo(x, y);
                    }
                    waveCtx.lineTo(w, h);
                    waveCtx.closePath();

                    const waveGrad = waveCtx.createLinearGradient(0, layer.baseY - layer.amplitude - 5, 0, h);
                    waveGrad.addColorStop(0, layer.color);
                    waveGrad.addColorStop(1, '#04121c');
                    waveCtx.fillStyle = waveGrad;
                    waveCtx.fill();

                    // Белая пена на гребнях (барашки)
                    for (let i = 1; i < points.length - 1; i++) {
                        const prev = points[i - 1];
                        const curr = points[i];
                        const next = points[i + 1];
                        if (curr.y < prev.y && curr.y < next.y) {
                            waveCtx.beginPath();
                            waveCtx.moveTo(curr.x - 3, curr.y - 2);
                            waveCtx.lineTo(curr.x + 3, curr.y - 2);
                            waveCtx.strokeStyle = `rgba(245,250,255,${layer.foamOpacity + 0.2})`;
                            waveCtx.lineWidth = 4;
                            waveCtx.stroke();
                            for (let d = 0; d < 5; d++) {
                                const dotX = curr.x + (Math.random() - 0.5) * 22;
                                const dotY = curr.y - Math.random() * 10 - 3;
                                waveCtx.beginPath();
                                waveCtx.arc(dotX, dotY, Math.random() * 3 + 1, 0, Math.PI * 2);
                                waveCtx.fillStyle = `rgba(255,255,250,${Math.random() * 0.6 + 0.4})`;
                                waveCtx.fill();
                            }
                        }
                    }
                });

                // Плавающие пенные частицы
                foamParticles.forEach((fp) => {
                    const waveInfluence = Math.sin(fp.x * 0.02 + waveTime * 0.6) * fp.amplitude +
                        Math.sin(fp.x * 0.045 + waveTime * 0.9) * fp.amplitude * 0.5;
                    const y = fp.baseY + waveInfluence + Math.sin(waveTime * fp.speed + fp.offset) * 6;
                    waveCtx.beginPath();
                    waveCtx.arc(fp.x, y, fp.radius, 0, Math.PI * 2);
                    waveCtx.fillStyle = `rgba(245,250,255,${fp.opacity})`;
                    waveCtx.fill();
                    waveCtx.beginPath();
                    waveCtx.arc(fp.x, y, fp.radius * 2.2, 0, Math.PI * 2);
                    waveCtx.fillStyle = `rgba(210,230,250,${fp.opacity * 0.3})`;
                    waveCtx.fill();
                });

                // Дельфины
                dolphinsTimer += 0.016;
                if (dolphinsTimer > 3.5 && Math.random() < 0.03) { // каждые ~3.5 сек шанс появления
                    spawnDolphin();
                    dolphinsTimer = 0;
                }
                for (let i = dolphins.length - 1; i >= 0; i--) {
                    const d = dolphins[i];
                    d.x += d.speed;
                    const jumpY = Math.sin(d.x * 0.03 + d.phase) * d.amplitude;
                    const currentY = d.y - jumpY;
                    if (d.x > w + 60) {
                        dolphins.splice(i, 1);
                        continue;
                    }

drawDolphin(waveCtx, d.x, currentY, d.scale);
                }

                waveCtx.restore(); // снять clip

                waveAnimationId = requestAnimationFrame(drawWaves);
            }

            function drawDolphin(ctx, x, y, scale) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                ctx.fillStyle = '#b0d4e8';
                ctx.strokeStyle = '#7fa3b3';
                ctx.lineWidth = 1.5;
                // Тело дельфина
                ctx.beginPath();
                ctx.moveTo(20, 0); // нос
                ctx.quadraticCurveTo(10, -12, -10, -8);
                ctx.quadraticCurveTo(-25, 0, -15, 10);
                ctx.quadraticCurveTo(0, 15, 20, 0);
                ctx.fill();
                ctx.stroke();
                // Плавник
                ctx.beginPath();
                ctx.moveTo(0, -2);
                ctx.lineTo(-5, -15);
                ctx.lineTo(8, -6);
                ctx.fill();
                ctx.stroke();
                // Глаз
                ctx.beginPath();
                ctx.arc(10, -3, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#111';
                ctx.fill();
                ctx.restore();
            }

            waveAnimationId = requestAnimationFrame(drawWaves);

            // ==================== FIREWORKS SYSTEM ====================
            let fireworkAnimationId;
            let fireworks = [];
            let fireworkParticles = [];
            let fireworksActive = false;

            function resizeFireworkCanvas() {
                fireworkCanvas.width = window.innerWidth;
                fireworkCanvas.height = window.innerHeight;
            }
            resizeFireworkCanvas();
            window.addEventListener('resize', resizeFireworkCanvas);

            class FireworkRocket {
                constructor(canvasW, canvasH) {
                    this.x = Math.random() * canvasW * 0.7 + canvasW * 0.15;
                    this.y = canvasH;
                    this.targetY = Math.random() * canvasH * 0.35 + canvasH * 0.08;
                    this.speed = Math.random() * 5 + 7;
                    this.exploded = false;
                    this.color = this.randomColor();
                    this.particleCount = Math.floor(Math.random() * 60 + 80);
                }
                randomColor() {
                    const palettes = [
                        { r: 255, g: 220, b: 140 },
                        { r: 255, g: 180, b: 160 },
                        { r: 180, g: 210, b: 255 },
                        { r: 255, g: 240, b: 200 },
                        { r: 220, g: 180, b: 255 },
                        { r: 255, g: 200, b: 180 },
                        { r: 200, g: 230, b: 255 },
                    ];
                    return palettes[Math.floor(Math.random() * palettes.length)];
                }
                update() {
                    if (!this.exploded) {
                        this.y -= this.speed;
                        this.speed *= 0.985;
                        if (this.y <= this.targetY || this.speed < 1.5) {
                            this.explode();
                        }
                    }
                }
                explode() {
                    this.exploded = true;
                    for (let i = 0; i < this.particleCount; i++) {
                        const angle = (Math.PI * 2 * i) / this.particleCount + (Math.random() - 0.5) * 0.3;
                        const velocity = Math.random() * 8 + 2;
                        fireworkParticles.push({
                            x: this.x,
                            y: this.y,
                            vx: Math.cos(angle) * velocity,
                            vy: Math.sin(angle) * velocity,
                            alpha: 1,
                            decay: Math.random() * 0.015 + 0.008,
                            color: this.color,
radius: Math.random() * 2.5 + 1.2,
                            gravity: 0.04,
                        });
                    }
                }
            }

            function drawFireworks(timestamp) {
                if (!fireworksActive && fireworkParticles.length === 0 && fireworks.length === 0) {
                    fireworkAnimationId = requestAnimationFrame(drawFireworks);
                    return;
                }
                const w = fireworkCanvas.width;
                const h = fireworkCanvas.height;
                fireworkCtx.clearRect(0, 0, w, h);

                if (fireworksActive && Math.random() < 0.04 && fireworks.length < 6) {
                    fireworks.push(new FireworkRocket(w, h));
                }

                for (let i = fireworks.length - 1; i >= 0; i--) {
                    const rocket = fireworks[i];
                    rocket.update();
                    if (rocket.exploded) fireworks.splice(i, 1);
                }

                for (let i = fireworkParticles.length - 1; i >= 0; i--) {
                    const p = fireworkParticles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.vx *= 0.99;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) {
                        fireworkParticles.splice(i, 1);
                        continue;
                    }
                    fireworkCtx.beginPath();
                    fireworkCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    fireworkCtx.fillStyle = `rgba(${p.color.r},${p.color.g},${p.color.b},${p.alpha})`;
                    fireworkCtx.fill();
                }
                fireworkAnimationId = requestAnimationFrame(drawFireworks);
            }
            fireworkAnimationId = requestAnimationFrame(drawFireworks);

            function startFireworks() {
                fireworksActive = true;
                fireworks.length = 0;
                fireworkParticles.length = 0;
                const w = fireworkCanvas.width;
                const h = fireworkCanvas.height;
                for (let i = 0; i < 5; i++) {
                    const rocket = new FireworkRocket(w, h);
                    rocket.targetY = Math.random() * h * 0.3 + h * 0.05;
                    rocket.y = h + Math.random() * 60;
                    fireworks.push(rocket);
                }
            }

            function stopFireworks() {
                fireworksActive = false;
                fireworks.length = 0;
                fireworkParticles.length = 0;
            }

            // ==================== CONFETTI SYSTEM ====================
            let confettiAnimationId;
            let confettiPieces = [];
            let confettiActive = false;

            function resizeConfettiCanvas() {
                confettiCanvas.width = window.innerWidth;
                confettiCanvas.height = window.innerHeight;
            }
            resizeConfettiCanvas();
            window.addEventListener('resize', resizeConfettiCanvas);

            function createConfettiPiece() {
                return {
                    x: Math.random() * confettiCanvas.width,
                    y: -10,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 6 + 4,
                    color: `hsl(${Math.random() * 360}, 80%, 65%)`,
                    speedY: Math.random() * 3 + 2,
                    speedX: (Math.random() - 0.5) * 2,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 8,
                };
            }

            function drawConfetti() {
                if (!confettiActive) {
                    confettiAnimationId = requestAnimationFrame(drawConfetti);
                    return;
                }
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
if (Math.random() < 0.25) {
                    confettiPieces.push(createConfettiPiece());
                }

                for (let i = confettiPieces.length - 1; i >= 0; i--) {
                    const p = confettiPieces[i];
                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.rotation += p.rotationSpeed;
                    if (p.y > confettiCanvas.height + 20) {
                        confettiPieces.splice(i, 1);
                        continue;
                    }
                    confettiCtx.save();
                    confettiCtx.translate(p.x, p.y);
                    confettiCtx.rotate(p.rotation * Math.PI / 180);
                    confettiCtx.fillStyle = p.color;
                    confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    confettiCtx.restore();
                }
                confettiAnimationId = requestAnimationFrame(drawConfetti);
            }
            confettiAnimationId = requestAnimationFrame(drawConfetti);

            function startConfetti() {
                confettiActive = true;
            }

            function stopConfetti() {
                confettiActive = false;
                confettiPieces.length = 0;
            }

            // ==================== LOADING SEQUENCE ====================
            function showTerminalLines() {
                const lines = document.querySelectorAll('.terminal-line[data-delay]');
                lines.forEach((line) => {
                    const delay = parseInt(line.getAttribute('data-delay'));
                    setTimeout(() => {
                        line.classList.add('visible');
                    }, delay);
                });
            }

            function animateProgressBar() {
                progressFill.style.width = '0%';
                const startTime = performance.now();
                const duration = 2000;
                function updateProgress(ts) {
                    const elapsed = ts - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
                    progressFill.style.width = (eased * 100) + '%';
                    if (progress < 1) {
                        requestAnimationFrame(updateProgress);
                    } else {
                        progressFill.style.width = '100%';
                        setTimeout(() => {
                            openBtnContainer.classList.add('visible');
                        }, 200);
                    }
                }
                requestAnimationFrame(updateProgress);
            }

            function startLoadingSequence() {
                shipBtn.classList.add('loading-active');
                shipBtn.style.pointerEvents = 'none';
                loadingOverlay.classList.add('active');
                document.querySelectorAll('.terminal-line[data-delay]').forEach(l => l.classList.remove('visible'));
                openBtnContainer.classList.remove('visible');
                progressFill.style.width = '0%';
                setTimeout(() => {
                    showTerminalLines();
                    animateProgressBar();
                }, 200);
            }

            // ==================== PAGE TRANSITIONS ====================
            function goToPage2() {
                stopAudio1();
                playAudio2();

                loadingOverlay.classList.remove('active');
                page1.classList.remove('page-visible');
                page1.classList.add('page-hidden');
                page2.classList.remove('page-hidden');
                page2.classList.add('page-visible');

                startFireworks();
                startConfetti();
                birthdayMsg.classList.add('visible');

                setTimeout(() => {
                    shipBtn.classList.remove('loading-active');
shipBtn.style.pointerEvents = 'auto';
                    progressFill.style.width = '0%';
                    document.querySelectorAll('.terminal-line[data-delay]').forEach(l => l.classList.remove(
                        'visible'));
                    openBtnContainer.classList.remove('visible');
                }, 1500);
            }

            function goBackToPage1() {
                stopAudio2();
                stopFireworks();
                stopConfetti();
                playAudio1();

                page2.classList.remove('page-visible');
                page2.classList.add('page-hidden');
                page1.classList.remove('page-hidden');
                page1.classList.add('page-visible');
                birthdayMsg.classList.remove('visible');
            }

            // ==================== EVENT LISTENERS ====================
            shipBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (audio1.paused) playAudio1();
                startLoadingSequence();
            });
            shipBtn.addEventListener('touchend', (e) => {
                e.stopPropagation();
                e.preventDefault();
                if (audio1.paused) playAudio1();
                startLoadingSequence();
            });

            openBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                goToPage2();
            });
            openBtn.addEventListener('touchend', (e) => {
                e.stopPropagation();
                e.preventDefault();
                goToPage2();
            });

            backButton.addEventListener('click', () => {
                goBackToPage1();
            });

            // ==================== INITIAL STATE ====================
            page1.classList.add('page-visible');
            page1.classList.remove('page-hidden');
            page2.classList.add('page-hidden');
            page2.classList.remove('page-visible');
            loadingOverlay.classList.remove('active');
            openBtnContainer.classList.remove('visible');
            birthdayMsg.classList.remove('visible');
            fireworksActive = false;
            confettiActive = false;

            console.log('🚢 Di.Nik v. 3.5 — Обновление 3.5 готово!');
            console.log('   Аудиофайлы: od.mp3 и jig.mp3 (замените на свои)');
        })();
    </script>
</body>
