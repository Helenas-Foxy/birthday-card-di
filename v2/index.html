<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хогвартс-35</title>
    <style>
        :root {
            --parchment: #f4e4c1;
            --parchment-dark: #d4b896;
            --gold: #d4a843;
            --gold-light: #f0d068;
            --brick: #5c3a2e;
            --brick-dark: #3a1f14;
            --night: #0a0a14;
            --night-blue: #0d1025;
            --magic-glow: #a8d8ea;
            --scroll-wood: #6b3a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', serif;
            cursor: default;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* ============ ФОН — РАСТЯНУТАЯ КАРТИНКА ============ */
        .background-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('images/p1.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        /* Звёзды / магические искры */
        .stars-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
            box-shadow: 0 0 var(--glow) 1px rgba(255, 255, 240, 0.9);
        }
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.15;
                transform: scale(1);
            }
            30% {
                opacity: 0.9;
                transform: scale(1.8);
            }
            60% {
                opacity: 0.2;
                transform: scale(0.7);
            }
            85% {
                opacity: 0.7;
                transform: scale(1.5);
            }
        }

        /* Платформа 9¾ — знак */
        .platform-sign {
            position: fixed;
            z-index: 2;
            left: 8%;
            top: 18%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .platform-pillar {
            width: 50px;
            height: 180px;
            background: linear-gradient(180deg, #6b3a2a 0%, #4a2215 40%, #5c3020 60%, #3a1a10 100%);
            border-radius: 8px 8px 0 0;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.7), inset 2px 0 8px rgba(255, 255, 255, 0.05);
            position: relative;
            border: 2px solid #3a1a10;
        }
        .platform-sign-board {
            background: #2c1810;
            color: #f0d068;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 20px #f0d068, 0 0 40px #d4a843;
            border: 3px solid #5c3a2e;
            box-shadow: 0 0 30px rgba(212, 168, 67, 0.4);
            white-space: nowrap;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        .platform-sign-board span {
            font-size: 1.1rem;
            vertical-align: super;
            margin-left: 2px;
        }

        /* Хогвартс-экспресс */
        .train-container {
            position: fixed;
            z-index: 2;
            right: -30px;
            bottom: 12%;
            pointer-events: none;
            animation: trainSteam 3s ease-in-out infinite;
        }
        @keyframes trainSteam {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }
        .train-body {
            width: 220px;
            height: 80px;
            background: linear-gradient(180deg, #8b1a1a 0%, #5c0e0e 50%, #3d0808 100%);
            border-radius: 12px 12px 6px 6px;
            position: relative;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), inset 0 2px 0 rgba(255, 200, 150, 0.2);
            border: 3px solid #2a0505;
        }
        .train-chimney {
            position: absolute;
            top: -35px;
            left: 30px;
            width: 28px;
            height: 40px;
            background: linear-gradient(180deg, #3a1a10 0%, #1a0805 100%);
            border-radius: 6px 6px 0 0;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
        }
        .train-window {
            position: absolute;
            top: 16px;
            width: 26px;
            height: 28px;
            background: #fce8b0;
            border-radius: 50%;
            box-shadow: 0 0 15px #fce8b0, 0 0 30px rgba(252, 232, 176, 0.6);
            border: 3px solid #3a1a10;
        }
        .train-window:nth-child(2) {
            left: 50px;
        }
        .train-window:nth-child(3) {
            left: 90px;
        }
        .train-window:nth-child(4) {
            left: 130px;
        }
        .train-window:nth-child(5) {
            left: 168px;
        }
        .steam-particle {
            position: absolute;
            top: -50px;
            left: 25px;
            width: 18px;
            height: 18px;
            background: rgba(200, 200, 210, 0.7);
            border-radius: 50%;
            animation: steamRise 2.5s ease-out infinite;
            box-shadow: 0 0 12px rgba(200, 200, 220, 0.5);
        }
        .steam-particle:nth-child(7) {
            animation-delay: 0s;
        }
        .steam-particle:nth-child(8) {
            animation-delay: 0.6s;
            left: 32px;
        }
        .steam-particle:nth-child(9) {
            animation-delay: 1.2s;
            left: 20px;
        }
        .steam-particle:nth-child(10) {
            animation-delay: 1.8s;
            left: 36px;
        }
        @keyframes steamRise {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-60px) translateX(15px) scale(2.5);
                opacity: 0.3;
            }
            100% {
                transform: translateY(-130px) translateX(30px) scale(4);
                opacity: 0;
            }
        }

        /* ============ ПАРЯЩИЕ ЭЛЕМЕНТЫ (ИЗОБРАЖЕНИЯ) ============ */
        .floating-element {
            position: fixed;
            z-index: 4;
            pointer-events: none;
            /* Увеличенный базовый размер */
            width: 80px;
            height: auto;
            filter: drop-shadow(0 0 12px rgba(212, 168, 67, 0.7));
            animation: floatAround var(--dur) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0.85;
            transition: filter 0.5s;
        }
        /* Индивидуальные размеры (увеличены) */
        .floating-element.snitch {
            width: 70px;
            animation-name: floatSnitch;
        }
        .floating-element.broom {
            width: 130px;
            animation-name: floatBroom;
        }
        .floating-element.lightning {
            width: 85px;
            animation-name: floatLightning;
            filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.9)) drop-shadow(0 0 30px rgba(255, 200, 50, 0.6));
        }
        .floating-element.hat {
            width: 100px;
            animation-name: floatHat;
        }
        .floating-element.crest {
            width: 110px;
            animation-name: floatCrest;
        }
        .floating-element.wand {
            width: 80px;
            animation-name: floatWand;
            filter: drop-shadow(0 0 15px rgba(180, 220, 255, 0.8));
        }
        .floating-element.hallows {
            width: 90px;
            animation-name: floatHallows;
        }
        .floating-element img {
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes floatSnitch {
            0%,
            100% {
                top: 15%;
                left: 10%;
                transform: rotate(0deg) translateY(0);
            }
            25% {
                top: 8%;
                left: 22%;
                transform: rotate(90deg) translateY(-20px);
            }
            50% {
                top: 18%;
                left: 30%;
                transform: rotate(180deg) translateY(10px);
            }
            75% {
                top: 10%;
                left: 16%;
                transform: rotate(270deg) translateY(-25px);
            }
        }
        @keyframes floatBroom {
            0%,
            100% {
                top: 65%;
                left: 75%;
                transform: rotate(-15deg) translateY(0);
            }
            30% {
                top: 55%;
                left: 82%;
                transform: rotate(-5deg) translateY(-30px);
            }
            60% {
                top: 72%;
                left: 70%;
                transform: rotate(-25deg) translateY(15px);
            }
            85% {
                top: 58%;
                left: 78%;
                transform: rotate(-10deg) translateY(-20px);
            }
        }
        @keyframes floatLightning {
            0%,
            100% {
                top: 20%;
                left: 78%;
                transform: scale(1) rotate(0deg);
            }
            20% {
                top: 12%;
                left: 72%;
                transform: scale(1.3) rotate(10deg);
            }
            40% {
                top: 25%;
                left: 84%;
                transform: scale(0.8) rotate(-8deg);
            }
            60% {
                top: 14%;
                left: 68%;
                transform: scale(1.4) rotate(5deg);
            }
            80% {
                top: 22%;
                left: 80%;
                transform: scale(0.9) rotate(-3deg);
            }
        }
        @keyframes floatHat {
            0%,
            100% {
                top: 70%;
                left: 12%;
                transform: rotate(0deg) translateY(0);
            }
            33% {
                top: 60%;
                left: 20%;
                transform: rotate(15deg) translateY(-18px);
            }
            66% {
                top: 75%;
                left: 8%;
                transform: rotate(-10deg) translateY(10px);
            }
        }
        @keyframes floatCrest {
            0%,
            100% {
                top: 25%;
                left: 60%;
                transform: scale(1) rotate(0deg);
            }
            40% {
                top: 18%;
                left: 55%;
                transform: scale(1.15) rotate(8deg);
            }
            70% {
                top: 30%;
                left: 65%;
                transform: scale(0.9) rotate(-5deg);
            }
        }
        @keyframes floatWand {
            0%,
            100% {
                top: 55%;
                left: 20%;
                transform: rotate(-30deg) translateY(0);
            }
            30% {
                top: 48%;
                left: 28%;
                transform: rotate(-15deg) translateY(-15px);
            }
            65% {
                top: 60%;
                left: 14%;
                transform: rotate(-40deg) translateY(12px);
            }
        }
        @keyframes floatHallows {
            0%,
            100% {
                top: 40%;
                left: 82%;
                transform: rotate(0deg) translateY(0);
                opacity: 0.7;
            }
            25% {
                top: 32%;
                left: 76%;
                transform: rotate(20deg) translateY(-22px);
                opacity: 1;
            }
            50% {
                top: 45%;
                left: 86%;
                transform: rotate(-15deg) translateY(8px);
                opacity: 0.6;
            }
            75% {
                top: 35%;
                left: 80%;
                transform: rotate(10deg) translateY(-18px);
                opacity: 0.9;
            }
        }

        /* ============ СОВА В ЦЕНТРЕ — СТАБИЛЬНАЯ, БЕЗ ПАРЕНИЯ ============ */
        .owl-container {
            position: fixed;
            z-index: 10;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: filter 0.3s, transform 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        .owl-container:hover {
            filter: drop-shadow(0 0 35px rgba(255, 220, 150, 0.95)) drop-shadow(0 0 65px rgba(255, 200, 100, 0.65));
            transform: translate(-50%, -50%) scale(1.04);
        }
        .owl-container:active {
            transform: translate(-50%, -50%) scale(0.94);
            transition: transform 0.1s;
        }
        /* Изображение совы — увеличенный размер */
        .owl-image {
            width: 500px;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
            transition: transform 0.3s;
        }
        .owl-letter {
            position: relative;
            margin-top: -18px;
            z-index: 11;
            background: #fdf5e6;
            border: 3px solid #c9a96e;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 0.75rem;
            color: #5c3a2e;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 8px rgba(139, 100, 60, 0.3);
            letter-spacing: 1px;
            font-weight: bold;
            animation: letterWiggle 2s ease-in-out infinite;
            white-space: nowrap;
            font-family: 'Georgia', serif;
        }
        .owl-letter::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 8px solid #c9a96e;
        }
        @keyframes letterWiggle {
            0%,
            100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(2deg);
            }
            75% {
                transform: rotate(-2deg);
            }
        }
        .owl-hint {
            position: absolute;
            bottom: -55px;
            left: 50%;
            transform: translateX(-50%);
            color: #f0d068;
            font-size: 0.9rem;
            letter-spacing: 2px;
            animation: hintPulse 2s ease-in-out infinite;
            white-space: nowrap;
            text-shadow: 0 0 12px rgba(240, 208, 104, 0.6);
            font-family: 'Georgia', serif;
        }
        @keyframes hintPulse {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* ============ МОДАЛЬНОЕ ОКНО — СВИТОК ============ */
        .modal-overlay {
            position: fixed;
            z-index: 100;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .scroll-wrapper {
            position: relative;
            width: 90%;
            max-width: 620px;
            transform: scaleY(0);
            transform-origin: center center;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            perspective: 1000px;
        }
        .modal-overlay.active .scroll-wrapper {
            transform: scaleY(1);
        }

        .scroll-parchment {
            background: linear-gradient(180deg,
                    #f7e8c8 0%, #f4e0b8 3%, #fdf4e0 8%, #f5e4c0 30%, #fdf5e6 50%, #f4e0b8 70%, #fdf4e0 92%, #f4e0b8 97%, #e8d5a8 100%);
            border-radius: 8px;
            padding: 40px 35px 35px;
            position: relative;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 0 6px #c9a96e,
                0 0 0 10px #8b5e3c,
                0 0 0 14px #c9a96e,
                inset 0 0 40px rgba(139, 100, 60, 0.15);
            border: 2px solid #b8945a;
            overflow: hidden;
        }
        .scroll-parchment::before,
        .scroll-parchment::after {
            content: '';
            position: absolute;
            left: -8px;
            right: -8px;
            height: 22px;
            background: linear-gradient(180deg, #6b3a2a, #8b5a3c, #5c2818);
            border-radius: 11px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }
        .scroll-parchment::before {
            top: -2px;
        }
        .scroll-parchment::after {
            bottom: -2px;
        }
        .wax-seal {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 40% 35%, #c41e3a, #7a1022);
            border-radius: 50%;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.5), inset 0 -2px 4px rgba(0, 0, 0, 0.3);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #f0d068;
            text-shadow: 0 0 6px #f0d068;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .scroll-close-btn {
            position: absolute;
            top: 18px;
            right: 22px;
            z-index: 10;
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #5c3a2e;
            transition: all 0.3s;
            line-height: 1;
            padding: 6px 10px;
            border-radius: 50%;
            font-family: serif;
        }
        .scroll-close-btn:hover {
            color: #c41e3a;
            transform: rotate(90deg);
            text-shadow: 0 0 10px rgba(196, 30, 58, 0.6);
        }
        .scroll-content {
            position: relative;
            z-index: 3;
            text-align: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #3a1a0a;
            font-size: 1.25rem;
            line-height: 1.9;
            letter-spacing: 0.5px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .scroll-content .revealed-text {
            display: inline;
        }
        .scroll-content .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 1.3em;
            background: #3a1a0a;
            margin-left: 2px;
            animation: blink 0.7s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        .scroll-title {
            font-size: 1.6rem;
            font-weight: bold;
            color: #5c1a0a;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* ============ КНОПКА МУЗЫКИ ============ */
        .music-toggle {
            position: fixed;
            z-index: 50;
            bottom: 25px;
            right: 25px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(30, 15, 10, 0.8);
            border: 2px solid #d4a843;
            color: #f0d068;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(212, 168, 67, 0.3);
        }
        .music-toggle:hover {
            background: rgba(50, 25, 15, 0.9);
            box-shadow: 0 0 25px rgba(212, 168, 67, 0.6);
            transform: scale(1.08);
        }
        .music-toggle.playing {
            animation: musicPulse 1.5s ease-in-out infinite;
        }
        @keyframes musicPulse {
            0%,
            100% {
                box-shadow: 0 0 15px rgba(212, 168, 67, 0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(240, 208, 104, 0.7);
            }
        }

        /* ============ АДАПТИВ ============ */
        @media (max-width: 768px) {
            .owl-image {
                width: 160px;
            }
            .owl-letter {
                font-size: 0.7rem;
                padding: 6px 14px;
            }
            .owl-hint {
                font-size: 0.75rem;
                bottom: -45px;
            }
            .floating-element {
                width: 60px;
            }
            .floating-element.snitch {
                width: 50px;
            }
            .floating-element.broom {
                width: 90px;
            }
            .floating-element.lightning {
                width: 60px;
            }
            .floating-element.hat {
                width: 70px;
            }
            .floating-element.crest {
                width: 75px;
            }
            .floating-element.wand {
                width: 55px;
            }
            .floating-element.hallows {
                width: 65px;
            }
            .scroll-parchment {
                padding: 30px 20px 25px;
            }
            .scroll-content {
                font-size: 1rem;
                line-height: 1.6;
            }
            .scroll-title {
                font-size: 1.3rem;
            }
            .platform-sign-board {
                font-size: 1.1rem;
                padding: 6px 14px;
            }
            .platform-pillar {
                width: 35px;
                height: 120px;
            }
            .train-body {
                width: 140px;
                height: 55px;
            }
            .train-chimney {
                width: 20px;
                height: 28px;
                top: -25px;
                left: 20px;
            }
            .train-window {
                width: 18px;
                height: 20px;
                top: 10px;
            }
            .train-window:nth-child(2) {
                left: 32px;
            }
            .train-window:nth-child(3) {
                left: 56px;
            }
            .train-window:nth-child(4) {
                left: 80px;
            }
            .train-window:nth-child(5) {
                left: 104px;
            }
        }
        @media (max-width: 480px) {
            .owl-image {
                width: 120px;
            }
            .owl-letter {
                font-size: 0.6rem;
                padding: 5px 10px;
                margin-top: -12px;
            }
            .owl-hint {
                font-size: 0.65rem;
                bottom: -38px;
            }
            .floating-element {
                width: 45px;
            }
            .floating-element.snitch {
                width: 38px;
            }
            .floating-element.broom {
                width: 65px;
            }
            .floating-element.lightning {
                width: 48px;
            }
            .floating-element.hat {
                width: 55px;
            }
            .floating-element.crest {
                width: 58px;
            }
            .floating-element.wand {
                width: 42px;
            }
            .floating-element.hallows {
                width: 50px;
            }
            .scroll-parchment {
                padding: 25px 15px 20px;
            }
            .scroll-content {
                font-size: 0.85rem;
            }
            .scroll-title {
                font-size: 1.1rem;
            }
            .platform-sign {
                left: 3%;
                top: 10%;
            }
            .platform-sign-board {
                font-size: 0.85rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ============ ФОН ============ -->
    <div class="background-scene"></div>
    <div class="stars-container" id="starsContainer"></div>

    <!-- ============ ПЛАТФОРМА 9¾ ============ -->
    <div class="platform-sign">
        <div class="platform-sign-board">Платформа 9<span>¾</span></div>
        <div class="platform-pillar"></div>
    </div>

    <!-- ============ ХОГВАРТС-ЭКСПРЕСС ============ -->
    <div class="train-container">
        <div class="train-body">
            <div class="train-chimney"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
        </div>
        <div class="steam-particle"></div>
        <div class="steam-particle"></div>
        <div class="steam-particle"></div>
        <div class="steam-particle"></div>
    </div>

    <!-- ============ ПАРЯЩИЕ ЭЛЕМЕНТЫ (ИЗОБРАЖЕНИЯ) ============ -->
    <!-- Золотой снитч -->
    <div class="floating-element snitch" style="--dur:9s;--delay:0s;" title="Золотой снитч">
        <img src="images/snitch.png" alt="Золотой снитч">
    </div>

    <!-- Метла Нимбус-2000 -->
    <div class="floating-element broom" style="--dur:11s;--delay:1.5s;" title="Нимбус-2000">
        <img src="images/nimbus.png" alt="Метла Нимбус-2000">
    </div>

    <!-- Очки и молния -->
    <div class="floating-element lightning" style="--dur:7s;--delay:0.8s;" title="Молния">
        <img src="images/ochki.png" alt="Очки и молния">
    </div>

    <!-- Распределяющая шляпа -->
    <div class="floating-element hat" style="--dur:13s;--delay:3s;" title="Распределяющая шляпа">
        <img src="images/schlapa.png" alt="Распределяющая шляпа">
    </div>

    <!-- Герб Хогвартса -->
    <div class="floating-element crest" style="--dur:10s;--delay:2s;" title="Герб Хогвартса">
        <img src="images/gerb.png" alt="Герб Хогвартса">
    </div>

    <!-- Знак Даров Смерти -->
    <div class="floating-element hallows" style="--dur:12s;--delay:2.5s;" title="Дары Смерти">
        <img src="images/znak.png" alt="Дары Смерти">
    </div>

    <!-- Фото Гарри — теперь с классом crest (другая траектория) -->
    <div class="floating-element crest" style="--dur:14s;--delay:4s;" title="Фото Гарри">
        <img src="images/foto.png" alt="Фото Гарри">
    </div>

    <!-- Газета — теперь с классом hat (другая траектория) -->
    <div class="floating-element hat" style="--dur:15s;--delay:5s;" title="Газета">
        <img src="images/gazeta.jpg" alt="Газета">
    </div>

    <!-- Палочка — теперь с классом wand (исправлен синтаксис) -->
    <div class="floating-element wand" style="--dur:8s;--delay:1s;" title="Палочка">
        <img src="images/palochka.png" alt="Палочка">
    </div>

    <!-- ============ СОВА С ПИСЬМОМ (СТАБИЛЬНАЯ, КЛИКАБЕЛЬНАЯ) ============ -->
    <div class="owl-container" id="owlContainer" title="Нажми, чтобы открыть письмо">
        <img src="images/sova.png" alt="Сова с письмом" class="owl-image">
        <div class="owl-letter">📨 Письмо из Хогвартса</div>
        <div class="owl-hint">✨ Нажми на сову ✨</div>
    </div>

    <!-- ============ МОДАЛЬНОЕ ОКНО — СВИТОК ============ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="scroll-wrapper" id="scrollWrapper">
            <div class="scroll-parchment">
                <button class="scroll-close-btn" id="scrollCloseBtn" title="Закрыть">✕</button>
                <div class="scroll-title">🎓 Хогвартс-35</div>
                <div class="scroll-content" id="scrollContent">
                    <!-- Текст будет появляться здесь побуквенно -->
                </div>
                <div class="wax-seal">H</div>
            </div>
        </div>
    </div>

    <!-- ============ АУДИО ============ -->
    <audio id="bgMusic" loop preload="auto">
        <source src="images/gp.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио.
    </audio>

    <!-- ============ КНОПКА МУЗЫКИ ============ -->
    <button class="music-toggle playing" id="musicToggle" title="Вкл/Выкл музыку">🎵</button>

    <script>
        (function() {
            // ============ ГЕНЕРАЦИЯ ЗВЁЗД ============
            const starsContainer = document.getElementById('starsContainer');
            const starCount = 80;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3.5 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
                star.style.setProperty('--delay', (Math.random() * 5) + 's');
                star.style.setProperty('--glow', (Math.random() * 6 + 2) + 'px');
                starsContainer.appendChild(star);
            }

            // ============ УПРАВЛЕНИЕ АУДИО ============
            const bgMusic = document.getElementById('bgMusic');
            const musicToggle = document.getElementById('musicToggle');
            let isMusicPlaying = false;

            function updateMusicButton() {
                if (isMusicPlaying) {
                    musicToggle.classList.add('playing');
                    musicToggle.textContent = '🎵';
                } else {
                    musicToggle.classList.remove('playing');
                    musicToggle.textContent = '🔇';
                }
            }

            function startMusic() {
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    updateMusicButton();
                }).catch(err => {
                    console.log('Автовоспроизведение заблокировано браузером. Нажмите на кнопку музыки.');
                    isMusicPlaying = false;
                    updateMusicButton();
                });
            }

            function stopMusic() {
                bgMusic.pause();
                isMusicPlaying = false;
                updateMusicButton();
            }

            function toggleMusic() {
                if (isMusicPlaying) {
                    stopMusic();
                } else {
                    startMusic();
                }
            }

            window.addEventListener('DOMContentLoaded', () => {
                bgMusic.volume = 0.5;
                startMusic();
            });

            document.addEventListener('click', function tryAutoplay() {
                if (!isMusicPlaying && bgMusic.paused) {
                    startMusic();
                }
            }, { once: false });

            musicToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMusic();
            });

            // ============ СОВА И СВИТОК ============
            const owlContainer = document.getElementById('owlContainer');
            const modalOverlay = document.getElementById('modalOverlay');
            const scrollWrapper = document.getElementById('scrollWrapper');
            const scrollContent = document.getElementById('scrollContent');
            const scrollCloseBtn = document.getElementById('scrollCloseBtn');

            const letterText =
                'Дорогая Диана, Вы зачислены в школу «Хогвартс-35»! В нашей школе Вас ждёт увлекательная жизнь!';

            let isRevealing = false;
            let revealTimeout = null;
            let revealedChars = 0;

            function openScroll() {
                if (isRevealing) return;
                if (!isMusicPlaying) {
                    startMusic();
                }
                modalOverlay.classList.add('active');
                scrollContent.innerHTML = '';
                revealedChars = 0;
                isRevealing = true;
                revealNextChar();
            }

            function revealNextChar() {
                if (!isRevealing) return;
                if (revealedChars < letterText.length) {
                    const currentText = letterText.substring(0, revealedChars + 1);
                    scrollContent.innerHTML =
                        '<span class="revealed-text">' + escapeHTML(currentText) + '</span>' +
                        '<span class="cursor-blink"></span>';
                    revealedChars++;
                    const delay = Math.random() * 55 + 30;
                    revealTimeout = setTimeout(revealNextChar, delay);
                } else {
                    scrollContent.innerHTML =
                        '<span class="revealed-text">' + escapeHTML(letterText) + '</span>';
                    isRevealing = false;
                    setTimeout(() => {
                        const cursor = scrollContent.querySelector('.cursor-blink');
                        if (cursor) cursor.remove();
                    }, 2000);
                }
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function closeScroll() {
                isRevealing = false;
                if (revealTimeout) {
                    clearTimeout(revealTimeout);
                    revealTimeout = null;
                }
                modalOverlay.classList.remove('active');
                scrollContent.innerHTML = '';
                revealedChars = 0;
            }

            owlContainer.addEventListener('click', (e) => {
                e.stopPropagation();
                if (modalOverlay.classList.contains('active')) {
                    closeScroll();
                } else {
                    openScroll();
                }
            });

            scrollCloseBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeScroll();
            });

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    closeScroll();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeScroll();
                }
            });

            // ============ МАГИЧЕСКИЕ ЧАСТИЦЫ ПРИ КЛИКЕ ============
            document.addEventListener('click', function(e) {
                const sparkCount = 8;
                for (let i = 0; i < sparkCount; i++) {
                    const spark = document.createElement('div');
                    spark.style.cssText = `
                        position: fixed;
                        z-index: 200;
                        pointer-events: none;
                        width: ${Math.random() * 6 + 3}px;
                        height: ${Math.random() * 6 + 3}px;
                        background: #f0d068;
                        border-radius: 50%;
                        left: ${e.clientX}px;
                        top: ${e.clientY}px;
                        box-shadow: 0 0 ${Math.random() * 8 + 4}px #f0d068;
                        transition: all ${Math.random() * 0.6 + 0.4}s ease-out;
                        opacity: 1;
                    `;
                    document.body.appendChild(spark);

                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 60 + 20;
                    const dx = Math.cos(angle) * distance;
                    const dy = Math.sin(angle) * distance;

                    requestAnimationFrame(() => {
                        spark.style.transform = `translate(${dx}px, ${dy}px) scale(0)`;
                        spark.style.opacity = '0';
                    });

                    setTimeout(() => {
                        spark.remove();
                    }, 1200);
                }
            });

            console.log('🦉✨ Хогвартс-35 приветствует Вас! Нажмите на сову, чтобы открыть письмо.');
        })();
    </script>
</body>
</html>
